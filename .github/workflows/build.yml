
name: Build SensiX APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Extract project
        run: |
          unzip SensiX-project.zip -d src

      - name: Build native library
        working-directory: src/SensiX
        run: bash build-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: src/SensiX
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SensiX-apk
          path: src/SensiX/app/build/outputs/apk/debug/app-debug.apk
          
